spring:
  application:
    name: si-notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seniorinsight}
    username: ${DB_USERNAME:seniorinsight}
    password: ${DB_PASSWORD:seniorinsight}
  flyway:
    enabled: true
    schemas: notification
    default-schema: notification
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:seniorinsight}
    password: ${RABBITMQ_PASSWORD:seniorinsight}
    # O relay da outbox espera o confirm do broker antes de marcar o evento como publicado.
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

server:
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

notification:
  rabbitmq:
    exchange: ${NOTIFICATION_RABBITMQ_EXCHANGE:si.events}
    queue: ${NOTIFICATION_RABBITMQ_QUEUE:notification.q}
    # Lista separada por vírgula: cada chave liga a fila à exchange.
    routing-keys: ${NOTIFICATION_RABBITMQ_ROUTING_KEYS:sos.updated,lgpd.erasure.requested,telemetry.signal.lost,telemetry.signal.recovered}
    dead-letter-exchange: ${NOTIFICATION_RABBITMQ_DEAD_LETTER_EXCHANGE:notification.dlx}
    dead-letter-queue: ${NOTIFICATION_RABBITMQ_DEAD_LETTER_QUEUE:notification.dlq}
    dead-letter-routing-key: ${NOTIFICATION_RABBITMQ_DEAD_LETTER_ROUTING_KEY:notification.dead}
  care:
    base-url: ${CARE_BASE_URL:http://care-service:8080}
    rede-cache-ttl: ${NOTIFICATION_CARE_REDE_CACHE_TTL:5m}
  expo:
    url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    access-token: ${EXPO_ACCESS_TOKEN:}
  sos:
    # RN-002: sem leitura neste prazo, reenvia o push e manda e-mail.
    prazo-leitura: ${NOTIFICATION_SOS_PRAZO_LEITURA:60s}
    intervalo-verificacao: ${NOTIFICATION_SOS_INTERVALO_VERIFICACAO:5s}
  exclusao:
    # HU-022: o care responde 404 até processar o pedido; depois do limite a exclusão segue sem o aviso.
    aviso-rede:
      tentativas: ${NOTIFICATION_EXCLUSAO_AVISO_TENTATIVAS:10}
      intervalo: ${NOTIFICATION_EXCLUSAO_AVISO_INTERVALO:2s}
    # Falha temporária (banco, por exemplo) repete a exclusão; no limite a mensagem vai para a notification.dlq.
    processamento:
      tentativas: ${NOTIFICATION_EXCLUSAO_TENTATIVAS:3}
      intervalo: ${NOTIFICATION_EXCLUSAO_INTERVALO:5s}
  outbox:
    relay:
      intervalo: ${NOTIFICATION_OUTBOX_RELAY_INTERVALO:1s}
      tamanho-lote: ${NOTIFICATION_OUTBOX_RELAY_TAMANHO_LOTE:100}
      timeout-confirmacao: ${NOTIFICATION_OUTBOX_RELAY_TIMEOUT_CONFIRMACAO:5s}
  sinal:
    intervalo-verificacao: ${NOTIFICATION_SINAL_INTERVALO_VERIFICACAO:30s}
    fuso-horario: ${NOTIFICATION_SINAL_FUSO_HORARIO:America/Sao_Paulo}
  email:
    remetente: ${NOTIFICATION_EMAIL_REMETENTE:nao-responda@seniorinsight.app}
